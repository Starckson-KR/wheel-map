name = "wheelmap-ai"
main = "src/index.ts"
compatibility_date = "2026-11-01"

# Workers AI 바인딩(키 없음). 코드에서는 env.AI.run(...)으로 부른다.
[ai]
binding = "AI"

[vars]
# 모델 이름: 나중에 바꾸기 쉽게 여기에 둔다(카탈로그: https://developers.cloudflare.com/workers-ai/models/)
AI_MODEL = "@cf/google/gemma-4-26b-a4b-it" # qwen3-30b-a3b-fp8은 2026-11-20에 종료됨
AI_PROVIDER = "anthropic" # 2026-11-28 사용자 결정: 분류를 Claude Haiku 5.5로. 이 줄을 지우면 예전처럼 Workers AI만 쓴다.
# AI 검색을 Claude로 돌리려면(기본은 꺼짐=Workers AI): AI_PROVIDER = "anthropic" 을 추가하고 secret ANTHROPIC_API_KEY를 넣는다. 모델은 ANTHROPIC_MODEL(기본 claude-haiku-5-5). 키가 없거나 호출이 실패하면 위 Workers AI로 넘어간다.
# AI 답변(POST /answer, 웹 검색을 쓰는 유료 경로)은 기본 꺼짐이다. 켜려면 ANSWER_ENABLED = "1" 을 추가한다(없거나 다른 값이면 404). 검색 1번에 약 1센트라 켜기 전에 상한을 확인한다: ANSWER_PER_MINUTE(기본 5), ANSWER_DAILY_LIMIT(기본 200).
# 허용 출처(쉼표로 구분, 끝의 / 없이). 그 외는 403
ALLOWED_ORIGINS = "https://starckson-kr.github.io,http://localhost:5173"
# IP별 분당 횟수, 전체 하루 상한(문자열로 적는다)
RATE_PER_MINUTE = "10"
DAILY_LIMIT = "500"
# 하루 계정당 쓰기 상한(제보·사진·설정 저장 합계)
DAILY_WRITE_LIMIT = "300"
# 광주 BIS 저상버스 중계: 하루 상류 호출 상한(운영계정 트래픽 하루 100,000건, 2026-11-18 승인 — 개발 스크립트 몫을 남겨 낮게), IP별 분당 요청 수. 키(DATA_GO_KR_KEY)는 secret으로만 넣는다.
BIS_DAILY_CAP = "20000"
BIS_PER_MINUTE = "30"
# 버스 길찾기(ODsay) 중계: 하루 상류 호출 상한(포털에 일 한도 표기 없음 — 확인 후 조정), IP별 분당 요청 수. 키(KOREACONNECT_KEY)는 secret으로만 넣는다.
TRANSIT_DAILY_CAP = "300"
TRANSIT_PER_MINUTE = "10"
TRANSIT_RELAY_URL = "https://211-233-209-65.sslip.io" # 국내 중계(relay/). 비밀값은 secret TRANSIT_RELAY_SECRET
# 날씨 중계: IP별 분당 요청 수
WEATHER_PER_MINUTE = "30"

# 간편 계정·공유 제보 저장소(Cloudflare D1, 무료)
[[d1_databases]]
binding = "DB"
database_name = "wheelmap-db"
database_id = "cefa78de-61e1-4f5b-9e5e-5a3d5cd4e7ab"
migrations_dir = "migrations"

# 실시간 알림 허브(Durable Object, SQLite 기반 클래스 — 무료 요금제는 SQLite 기반만 가능). WebSocket으로 「바뀌었다」 신호만 보낸다.
[[durable_objects.bindings]]
name = "HUB"
class_name = "RealtimeHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RealtimeHub"]
